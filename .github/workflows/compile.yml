name: Compilar Dylib iOS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Theos e SDKs
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # Baixar headers do Substrate necessários para o hooking
          mkdir -p $THEOS/include
          curl -L https://raw.githubusercontent.com/theos/headers/master/substrate.h -o $THEOS/include/substrate.h
          
      - name: Compilar Dylib
        run: |
          export THEOS=~/theos
          # Comando de compilação corrigido com caminhos para os headers do Theos
          xcrun --sdk iphoneos clang -shared -arch arm64 \
          -mios-version-min=12.0 -fobjc-arc \
          -I$THEOS/include \
          -framework Foundation \
          FileRedirectionDylib.mm -o FileRedirection.dylib
          
      - name: Upload do Binário
        uses: actions/upload-artifact@v3
        with:
          name: FileRedirection-Dylib
          path: FileRedirection.dylib
